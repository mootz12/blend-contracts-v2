[workspace]
resolver = "2"

members = [
    "backstop",
    "pool",
    "mocks/mock-pool",
    "mocks/mock-pool-factory",
    "mocks/moderc3156",
    "pool-factory",
    "test-suites"
]

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.release]
opt-level = "z"
overflow-checks = true # DEV: Do not remove this check - doing so will create vulnerabilities
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies.soroban-sdk]
version = "26.0.0-rc.1"
features = ["experimental_spec_shaking_v2"]

[workspace.dependencies.soroban-fixed-point-math]
# version = "1.5.0"
git = "https://github.com/script3/soroban-fixed-point-math"
branch = "p26"

[workspace.dependencies.cast]
version = "0.3.0"
default-features = false

[workspace.dependencies.sep-40-oracle]
# version = "1.4.0"
git = "https://github.com/script3/sep-40-oracle"
branch = "p26"

[workspace.dependencies.sep-41-token]
# version = "1.4.0"
git = "https://github.com/script3/sep-41-token"
branch = "p26"

[patch.crates-io]
soroban-sdk = { path = "../../../stellar/rs-soroban-sdk/soroban-sdk" }
soroban-sdk-macros = { path = "../../../stellar/rs-soroban-sdk/soroban-sdk-macros" }
soroban-meta = { path = "../../../stellar/rs-soroban-sdk/soroban-meta" }
soroban-spec = { path = "../../../stellar/rs-soroban-sdk/soroban-spec" }
soroban-spec-rust = { path = "../../../stellar/rs-soroban-sdk/soroban-spec-rust" }
soroban-ledger-snapshot = { path = "../../../stellar/rs-soroban-sdk/soroban-ledger-snapshot" }
soroban-token-sdk = { path = "../../../stellar/rs-soroban-sdk/soroban-token-sdk" }
soroban-token-spec = { path = "../../../stellar/rs-soroban-sdk/soroban-token-spec" }
stellar-asset-spec = { path = "../../../stellar/rs-soroban-sdk/stellar-asset-spec" }